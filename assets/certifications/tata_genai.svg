<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="tata-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="tata-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="tata-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="tata-chart" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Container Squircle -->
  <rect x="2" y="2" width="92" height="92" rx="20" fill="url(#tata-bg)" stroke="url(#tata-border)" stroke-width="2"/>

  <!-- Stylized TATA "T" Arc Top -->
  <path d="M28 24 Q48 18 68 24 L64 30 Q48 25 32 30 Z" fill="#ffffff" opacity="0.95"/>
  <rect x="44" y="28" width="8" height="18" rx="2" fill="#ffffff" opacity="0.95"/>

  <!-- GenAI / Data Analytics Chart Bars -->
  <rect x="24" y="52" width="8" height="12" rx="2" fill="url(#tata-cyan)"/>
  <rect x="36" y="44" width="8" height="20" rx="2" fill="url(#tata-cyan)"/>
  <rect x="48" y="48" width="8" height="16" rx="2" fill="url(#tata-cyan)"/>
  <rect x="60" y="38" width="8" height="26" rx="2" fill="url(#tata-chart)"/>

  <!-- AI Sparkle / Trending Arrow -->
  <path d="M26 48 L38 40 L50 44 L66 32" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow Head -->
  <polyline points="59,32 66,32 66,39" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pill Tag at bottom -->
  <rect x="22" y="70" width="52" height="15" rx="7.5" fill="rgba(56, 189, 248, 0.2)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
  <text x="48" y="81" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#bae6fd" text-anchor="middle" letter-spacing="1">TATA • GENAI</text>
</svg>
