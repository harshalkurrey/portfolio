<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="ibm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48"/>
      <stop offset="50%" stop-color="#0b1e36"/>
      <stop offset="100%" stop-color="#030b14"/>
    </linearGradient>
    <linearGradient id="ibm-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f62fe" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4589ff" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="java-steam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="ibm-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4589ff"/>
      <stop offset="100%" stop-color="#0f62fe"/>
    </linearGradient>
  </defs>

  <!-- Container Squircle -->
  <rect x="2" y="2" width="92" height="92" rx="20" fill="url(#ibm-bg)" stroke="url(#ibm-border)" stroke-width="2"/>

  <!-- IBM Striped Header Accent -->
  <g fill="#0f62fe" opacity="0.9">
    <rect x="26" y="18" width="44" height="2"/>
    <rect x="26" y="22" width="44" height="2"/>
    <rect x="26" y="26" width="44" height="2"/>
  </g>

  <!-- Java Cup & Steam / OOP Tree -->
  <!-- Steam Wiggles -->
  <path d="M42 33 C40 37 46 39 44 43" fill="none" stroke="url(#java-steam)" stroke-width="2" stroke-linecap="round"/>
  <path d="M49 31 C47 36 53 38 51 43" fill="none" stroke="url(#java-steam)" stroke-width="2" stroke-linecap="round"/>

  <!-- Coffee Cup Body -->
  <path d="M36 43 L38 57 C38 61 58 61 58 57 L60 43 Z" fill="url(#ibm-blue)"/>
  <!-- Cup Handle -->
  <path d="M60 46 C65 46 66 53 60 55" fill="none" stroke="url(#ibm-blue)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Cup Saucer -->
  <path d="M32 61 L64 61" stroke="#82cfff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- OOP Hierarchy Dots -->
  <circle cx="26" cy="46" r="2.5" fill="#82cfff"/>
  <line x1="28.5" y1="46" x2="35" y2="46" stroke="#82cfff" stroke-width="1.5" stroke-dasharray="2 1"/>
  <circle cx="70" cy="46" r="2.5" fill="#82cfff"/>
  <line x1="61" y1="46" x2="67.5" y2="46" stroke="#82cfff" stroke-width="1.5" stroke-dasharray="2 1"/>

  <!-- Pill Tag at bottom -->
  <rect x="22" y="70" width="52" height="15" rx="7.5" fill="rgba(15, 98, 254, 0.2)" stroke="rgba(15, 98, 254, 0.4)" stroke-width="1"/>
  <text x="48" y="81" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#a6c8ff" text-anchor="middle" letter-spacing="1">IBM • JAVA</text>
</svg>
