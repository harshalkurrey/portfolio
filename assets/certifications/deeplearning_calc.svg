<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="dl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="dl-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="dl-curve" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Container Squircle -->
  <rect x="2" y="2" width="92" height="92" rx="20" fill="url(#dl-bg)" stroke="url(#dl-border)" stroke-width="2"/>

  <!-- Calculus Gradient Descent 3D Parabola Curve -->
  <path d="M22 30 Q34 60 48 60 Q62 60 74 30" fill="none" stroke="rgba(244, 63, 94, 0.3)" stroke-width="2"/>
  <path d="M26 36 Q36 56 48 56 Q60 56 70 36" fill="none" stroke="url(#dl-curve)" stroke-width="3" stroke-linecap="round"/>

  <!-- Tangent Slope Line / Derivative vector -->
  <line x1="30" y1="52" x2="62" y2="40" stroke="#fde047" stroke-width="2" stroke-linecap="round"/>

  <!-- Gradient Descent Minimum Point (Star/Node) -->
  <circle cx="48" cy="56" r="4.5" fill="#fde047"/>
  <circle cx="48" cy="56" r="2" fill="#881337"/>

  <!-- Nabla / Gradient Vector Symbol at top -->
  <polygon points="48,34 38,20 58,20" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="48" cy="25" r="1.5" fill="#f43f5e"/>

  <!-- Pill Tag at bottom -->
  <rect x="20" y="72" width="56" height="15" rx="7.5" fill="rgba(244, 63, 94, 0.2)" stroke="rgba(244, 63, 94, 0.4)" stroke-width="1"/>
  <text x="48" y="83" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#fecdd3" text-anchor="middle" letter-spacing="0.8">DEEPLEARNING</text>
</svg>
