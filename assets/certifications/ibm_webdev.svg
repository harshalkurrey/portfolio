<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="web-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#044e54"/>
    </linearGradient>
    <linearGradient id="web-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f62fe" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="web-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Container Squircle -->
  <rect x="2" y="2" width="92" height="92" rx="20" fill="url(#web-bg)" stroke="url(#web-border)" stroke-width="2"/>

  <!-- Browser Window Frame -->
  <rect x="18" y="22" width="60" height="42" rx="6" fill="#0b1728" stroke="url(#web-cyan)" stroke-width="2"/>
  <line x1="18" y1="32" x2="78" y2="32" stroke="rgba(34, 211, 238, 0.3)" stroke-width="1.5"/>

  <!-- Window Dots -->
  <circle cx="25" cy="27" r="2" fill="#ef4444"/>
  <circle cx="31" cy="27" r="2" fill="#f59e0b"/>
  <circle cx="37" cy="27" r="2" fill="#10b981"/>

  <!-- Code Brackets & Slash in Browser -->
  <path d="M34 40 L28 48 L34 56 M62 40 L68 48 L62 56 M52 38 L44 58" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pill Tag at bottom -->
  <rect x="22" y="72" width="52" height="15" rx="7.5" fill="rgba(6, 182, 212, 0.2)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1"/>
  <text x="48" y="83" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#a5f3fc" text-anchor="middle" letter-spacing="1">IBM • WEB</text>
</svg>
