<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="btech-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="btech-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="btech-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="btech-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="btech-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="2" y="2" width="92" height="92" rx="20" fill="url(#btech-bg)" stroke="url(#btech-border)" stroke-width="2"/>

  <!-- Circuit Pattern Background -->
  <path d="M18 70 L34 70 L42 62 M78 70 L62 70 L54 62 M48 76 L48 64" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <circle cx="42" cy="62" r="2.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="54" cy="62" r="2.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="48" cy="76" r="2" fill="#38bdf8" opacity="0.6"/>

  <!-- Graduation Mortarboard Cap (Top Rhombus) -->
  <g filter="url(#btech-glow)">
    <!-- Top Cap Diamond -->
    <path d="M48 22 L76 34 L48 46 L20 34 Z" fill="url(#btech-cyan)"/>
    <path d="M48 23.5 L73 34 L48 44.5 L23 34 Z" fill="#0f172a" opacity="0.35"/>

    <!-- Skull Cap Underneath -->
    <path d="M30 40 L30 50 C30 56 66 56 66 50 L66 40" fill="none" stroke="url(#btech-cyan)" stroke-width="3" stroke-linecap="round"/>

    <!-- Tassel & Ribbon -->
    <path d="M48 34 L66 38 L68 53" fill="none" stroke="url(#btech-gold)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="48" cy="34" r="3" fill="url(#btech-gold)"/>
    <!-- Tassel Brush -->
    <path d="M65 53 L71 53 L68 60 Z" fill="url(#btech-gold)"/>
  </g>

  <!-- Binary Code Accent Pill -->
  <rect x="26" y="66" width="44" height="15" rx="7.5" fill="rgba(99, 102, 241, 0.2)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1"/>
  <text x="48" y="77" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">B.TECH</text>
</svg>
